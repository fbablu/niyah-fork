name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing-pg/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-pg
    steps:
      - uses: actions/checkout@v4

      # setup-node before pnpm/action-setup — pnpm 11.5.2 needs Node >= 22.13,
      # else the self-installer fails with "self-installer exits with code 1".
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing-pg/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
