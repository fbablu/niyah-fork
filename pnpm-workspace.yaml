# Migrated from package.json "pnpm" field (pnpm 11 no longer reads it).
overrides:
  tar: 7.5.16 # was 7.5.10 — GHSA node-tar drive-relative symlink traversal (patched >=7.5.11)
  minimatch@5: 5.1.8
  ajv@8: 8.18.0
  node-forge: '>=1.3.2'
  # Dependabot: build-tooling transitive deps (not in app runtime)
  '@xmldom/xmldom@<0.8.13': 0.8.13 # @expo/plist — XML injection (comment/CDATA/PI/DocType serialization)
  postcss: '>=8.5.10' # @expo/metro-config — XSS via unescaped </style>
  uuid: ^11.1.1 # eas-cli/xcode/bacons/expo dev tooling — missing buffer bounds check in v3/v5/v6 (11.x keeps CJS)

patchedDependencies:
  '@bacons/apple-targets@4.0.7': patches/@bacons__apple-targets@4.0.7.patch

# Build scripts that ran under pnpm 10 — keep enabled.
allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  dtrace-provider: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - tar@7.5.16
